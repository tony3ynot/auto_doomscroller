[project]
name = "autodoom"
version = "0.1.0"
description = "Offline analysis, training and model optimization for auto_doomscroller"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
quant = ["tensorflow>=2.16"]
# Frame / caption embeddings for offline experiments (autodoom.embed)
embed = ["tensorflow>=2.16", "torch>=2.4", "open_clip_torch>=2.24", "sentence-transformers>=3.0"]
# Text on the frame (autodoom.ocr)
ocr = ["easyocr>=1.7"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodoom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
